name: Playwright Tests
env: 
  TEST_SAUCEDEMO_LOGIN: ${{ secrets.TEST_SAUCEDEMO_LOGIN }}
  TEST_SAUCEDEMO_PASSWORD: ${{ secrets.TEST_SAUCEDEMO_PASSWORD }}
  TEST_DEMOBLAZE_LOGIN: ${{ secrets.TEST_DEMOBLAZE_LOGIN }}
  TEST_DEMOBLAZE_PASSWORD: ${{ secrets.TEST_DEMOBLAZE_PASSWORD }}
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Upload HTML test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 30
    - name: Upload test results (screenshots, traces, videos)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 3
